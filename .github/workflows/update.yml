# 毎朝6:30(日本時間)に 取得・読み取り → サイト作成・公開 → X投稿 → data/ を保存。
# 全体障害(APIのクレジット切れなど)や投稿失敗があれば、サイトは前回の値で公開したうえでジョブを失敗にする
# (GitHubから失敗メールが届く。DISCORD_WEBHOOK_URL があればDiscordにも届く)。
name: update

on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = JST 6:30
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      EN_SITE_URL: ${{ vars.EN_SITE_URL }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      HATENA_ID: ${{ secrets.HATENA_ID }}
      HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
      HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      CAMPAIGN_MODEL: ${{ vars.CAMPAIGN_MODEL || 'claude-haiku-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 取得・読み取り
        id: monitor
        continue-on-error: true
        run: python monitor.py

      - name: ふるさと納税の返礼品を集める
        id: furusato
        continue-on-error: true
        run: python furusato/collect.py

      - name: 補助金を集める
        id: hojokin
        continue-on-error: true
        run: |
          python hojokin/discover.py
          python hojokin/collect.py

      - name: 英語サイト(蓄電池・VPS)の価格を集める
        id: en
        continue-on-error: true
        run: |
          python en/power/collect.py
          python en/vps/collect.py

      - name: サイト作成
        run: |
          python hojokin/build.py
          python build_site.py
          python furusato/build.py
          python en/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 公開
        id: deploy
        uses: actions/deploy-pages@v4

      - name: X投稿
        id: post
        continue-on-error: true
        run: python post_x.py

      - name: はてなブログの記事を更新
        id: hatena
        continue-on-error: true
        run: python hatena/publish.py

      - name: data/ を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +%F)"
            git push
          fi

      - name: 異常があれば失敗にする
        if: steps.monitor.outcome == 'failure' || steps.post.outcome == 'failure' || steps.furusato.outcome == 'failure' || steps.hatena.outcome == 'failure' || steps.hojokin.outcome == 'failure' || steps.en.outcome == 'failure'
        run: |
          echo "::error::monitor=${{ steps.monitor.outcome }} furusato=${{ steps.furusato.outcome }} hatena=${{ steps.hatena.outcome }} hojokin=${{ steps.hojokin.outcome }} en=${{ steps.en.outcome }} post=${{ steps.post.outcome }}。ログとDiscordの通知を確認してください"
          exit 1

# 監視する銀行ページの一覧。
#   name: 表示名
#   url: 金利・キャンペーンが載っている公式ページ(監視に使う)
#   apply_url: 申込リンク。アフィリエイト(A8.netなど)に登録したら、ここを広告リンクに差し替える。空なら url を使う。
#   ad: true なら申込リンクを広告(PR)として表示する。ステマ規制により広告リンクには表示が必須。
# ページが変わって読めなくなった場合は、通知が来るので url を直す。
# 自動取得を拒否しているサイト(403やrobots.txtで禁止)は載せない。ドコモSMTBネット銀行・楽天銀行・UI銀行は403のため外した。

